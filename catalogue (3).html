<style>
  :root{
    --ink:#201a13; --ink-soft:#4a4032;
    --cream:#f7f1e4; --cream-2:#efe4cd; --paper:#fffbf2;
    --terracotta:#bf5122; --terracotta-dark:#9a3f19;
    --line:rgba(32,26,19,.16); --line-strong:rgba(32,26,19,.32);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{background:var(--cream);color:var(--ink);font-family:'Instrument Sans',sans-serif;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  button{font:inherit;}
  img{display:block;max-width:100%;}
  :focus-visible{outline:2px solid var(--terracotta);outline-offset:3px;}
  .wrap{width:min(1320px,94%);margin:0 auto;}

  header{position:sticky;top:0;z-index:30;background:rgba(247,241,228,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .header-inner{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:10px 0;}
  .brand{font-family:'Fraunces',serif;font-weight:700;font-size:16px;letter-spacing:.26em;text-transform:uppercase;}
  .brand:hover{opacity:.7;}
  .header-actions{display:flex;align-items:center;gap:14px;}
  .wa-link{border:1px solid var(--ink);padding:9px 16px;font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;transition:background .25s ease,color .25s ease;}
  .wa-link:hover{background:var(--ink);color:var(--cream);}

  .page-head{padding:40px 0 26px;text-align:center;}
  .page-head .eyebrow{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--terracotta-dark);margin-bottom:10px;}
  .page-head h1{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(2rem,5vw,3.1rem);}
  .page-head p{margin-top:10px;color:var(--ink-soft);font-size:.95rem;}

  /* ---- FILTER CHIPS ---- */
  .filters{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:0 0 34px;}
  .chip{
    border:1px solid var(--line-strong);
    background:var(--paper);
    padding:11px 20px;
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    cursor:pointer;
    border-radius:100px;
    transition:background .2s ease,color .2s ease,border-color .2s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--cream);}
  .count{opacity:.65;padding:0 0 34px;text-align:center;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-top:-18px;}

  /* ---- NATURAL-RATIO GRID (JS row-span, never crops) ---- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    grid-auto-rows:4px;
    gap:16px;
    padding-bottom:70px;
  }
  @media(min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:20px;}}
  @media(min-width:1100px){.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));}}

  .card{
    background:var(--paper);
    border:1px solid var(--line);
    overflow:hidden;
    cursor:pointer;
    display:flex;
    flex-direction:column;
  }
  .card.hidden{display:none;}
  .card.feature{grid-column:span 1;}
  @media(min-width:640px){ .card.feature{grid-column:span 2;} }
  .card-media{width:100%;background:var(--cream-2);}
  .card-media img{width:100%;height:auto;display:block;transition:transform .5s ease;}
  .card:hover .card-media img{transform:scale(1.02);}
  .card-body{padding:12px 14px 15px;flex-grow:1;display:flex;flex-direction:column;gap:4px;}
  .card-cat{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--terracotta-dark);}
  .card-name{font-family:'Fraunces',serif;font-weight:600;font-size:.95rem;line-height:1.25;}
  .card-code{font-family:'Space Mono',monospace;font-size:9.5px;color:var(--ink-soft);letter-spacing:.04em;}
  .card-new{position:absolute;margin:10px;background:var(--terracotta);color:#fff;font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:5px 9px;}
  .card-media{position:relative;}
  .card-wa{
    margin-top:6px;
    align-self:flex-start;
    font-family:'Space Mono',monospace;
    font-size:9.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--terracotta-dark);
    border-bottom:1px solid var(--terracotta-dark);
    padding-bottom:1px;
  }

  .empty-state{display:none;text-align:center;padding:70px 20px 90px;color:var(--ink-soft);}
  .empty-state.show{display:block;}
  .empty-state h2{font-family:'Fraunces',serif;font-size:1.5rem;margin-bottom:10px;color:var(--ink);}

  .back-to-top{position:fixed;right:18px;bottom:18px;z-index:40;width:46px;height:46px;border:1px solid var(--ink);border-radius:50%;background:var(--ink);color:#fff;cursor:pointer;font-size:22px;line-height:1;opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .2s ease,transform .2s ease,visibility .2s ease;}
  .back-to-top.visible{opacity:1;visibility:visible;transform:translateY(0);}

  /* ---- LIGHTBOX ---- */
  .lightbox{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(20,16,11,.95);}
  .lightbox.active{display:flex;}
  .lightbox-content{position:relative;max-width:min(1000px,100%);max-height:100%;width:100%;display:flex;flex-direction:column;align-items:center;}
  .lightbox-image-wrap{display:flex;align-items:center;justify-content:center;max-height:72vh;width:100%;}
  .lightbox-image-wrap img{max-width:100%;max-height:72vh;width:auto;height:auto;object-fit:contain;}
  .lightbox-meta{color:#fff;text-align:center;padding-top:16px;}
  .lightbox-meta .lb-cat{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#e0a26b;margin-bottom:4px;}
  .lightbox-meta h3{font-family:'Fraunces',serif;font-size:1.2rem;}
  .lightbox-actions{padding-top:14px;}
  .enquire-btn{display:inline-block;border:1px solid #fff;background:#fff;color:var(--ink);font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.08em;padding:12px 20px;text-transform:uppercase;}
  .lightbox-close,.lightbox-nav{position:absolute;display:grid;place-items:center;width:42px;height:42px;border:1px solid rgba(255,255,255,.55);border-radius:50%;background:rgba(0,0,0,.3);color:#fff;cursor:pointer;font-size:24px;-webkit-tap-highlight-color:transparent;}
  .lightbox-close{top:-10px;right:-10px;}
  .lightbox-nav{top:36%;transform:translateY(-50%);}
  .lightbox-nav.prev{left:-58px;}
  .lightbox-nav.next{right:-58px;}
  @media(max-width:900px){
    .lightbox-nav.prev{left:6px;}
    .lightbox-nav.next{right:6px;}
    .lightbox-close{top:8px;right:8px;}
  }

  footer{border-top:1px solid var(--line);padding:34px 0 44px;text-align:center;}
  footer a{font-family:'Fraunces',serif;font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;}

  @media(prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;transition-duration:.001ms !important;scroll-behavior:auto !important;}
  }
</style>

  /* ============================================================
     RENDER + FILTER + LIGHTBOX — no need to edit below this line.
     ============================================================ */
  const CATS = [
    { key:'all', label:'All' },
    { key:'shirts', label:'Shirts' },
    { key:'jeans', label:'Jeans' },
    { key:'co-ords', label:'Co-ords' },
    { key:'jackets', label:'Jackets' },
    { key:'new', label:'New In' }
  ];

  const grid = document.getElementById('grid');
  const filtersEl = document.getElementById('filters');
  const emptyState = document.getElementById('emptyState');
  const resultCount = document.getElementById('resultCount');
  const lightbox = document.getElementById('lightbox');
  const lightboxImage = document.getElementById('lightboxImage');
  const lightboxCat = document.getElementById('lightboxCat');
  const lightboxName = document.getElementById('lightboxName');
  let activeFilter = 'all';
  let currentIndex = 0;

  function visibleProducts(){
    if (activeFilter === 'all') return products;
    if (activeFilter === 'new') return products.filter(p => p.newIn);
    return products.filter(p => p.category === activeFilter);
  }

  function buildFilters(){
    filtersEl.innerHTML = CATS.map(c => {
      const n = c.key === 'all' ? products.length : (c.key === 'new' ? products.filter(p=>p.newIn).length : products.filter(p=>p.category===c.key).length);
      return '<button class="chip" data-key="'+c.key+'" aria-pressed="'+(c.key==='all') +'">'+c.label+' ('+n+')</button>';
    }).join('');
    filtersEl.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', () => {
        activeFilter = btn.dataset.key;
        filtersEl.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'));
        renderGrid();
      });
    });
  }

  function buildCard(p, globalIndex){
    const card = document.createElement('div');
    card.className = 'card' + (globalIndex % 9 === 0 ? ' feature' : '');
    card.dataset.id = p.id;
    card.style.gridRowEnd = 'span 90'; // reasonable placeholder height until sizeAllCards() corrects it

    const media = document.createElement('div');
    media.className = 'card-media';
    if (p.newIn){
      const badge = document.createElement('span');
      badge.className = 'card-new';
      badge.textContent = 'New';
      media.appendChild(badge);
    }
    const img = document.createElement('img');
    img.src = encodeURI(p.file);
    img.alt = 'Youniverse — ' + p.name;
    img.loading = 'lazy';
    media.appendChild(img);

    const body = document.createElement('div');
    body.className = 'card-body';
    body.innerHTML =
      '<span class="card-cat">' + p.category + '</span>' +
      '<span class="card-name">' + p.name + '</span>' +
      (p.article ? '<span class="card-code">' + p.article + '</span>' : '') +
      '<span class="card-wa">Enquire on WhatsApp</span>';

    card.appendChild(media);
    card.appendChild(body);
    card.addEventListener('click', () => openLightbox(p.id));
    return card;
  }

  function renderGrid(){
    const list = visibleProducts();
    grid.innerHTML = '';
    list.forEach((p, i) => grid.appendChild(buildCard(p, i)));
    emptyState.classList.toggle('show', list.length === 0);
    grid.style.display = list.length === 0 ? 'none' : 'grid';
    resultCount.textContent = list.length + (list.length === 1 ? ' piece' : ' pieces');
    // wait for images to load, then size rows so nothing crops
    requestAnimationFrame(sizeAllCards);
  }

  function sizeAllCards(){
    const rowH = 4; // matches grid-auto-rows
    const gap = parseFloat(getComputedStyle(grid).gap) || 16;
    grid.querySelectorAll('.card').forEach(card => {
      const img = card.querySelector('img');
      const applySpan = () => {
        // scrollHeight reads the card's true, unclipped content height —
        // getBoundingClientRect() would only return the *already-constrained*
        // grid-row height, which is why every card was collapsing to a sliver.
        const contentHeight = card.scrollHeight;
        const span = Math.ceil((contentHeight + gap) / (rowH + gap));
        card.style.gridRowEnd = 'span ' + span;
      };
      if (img.complete && img.naturalWidth) applySpan();
      else img.addEventListener('load', applySpan, { once:true });
    });
  }
  window.addEventListener('resize', () => { clearTimeout(window.__rt); window.__rt = setTimeout(sizeAllCards, 150); });

  function openLightbox(id){
    const list = visibleProducts();
    currentIndex = list.findIndex(p => p.id === id);
    updateLightbox(list);
    lightbox.classList.add('active');
    lightbox.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }
  function updateLightbox(list){
    list = list || visibleProducts();
    const p = list[currentIndex];
    lightboxImage.src = encodeURI(p.file);
    lightboxImage.alt = 'Youniverse — ' + p.name;
    lightboxCat.textContent = p.category;
    lightboxName.textContent = p.name;
    const msg = 'Hi Youniverse, I\'m interested in "' + p.name + '" (' + p.category + (p.article ? ', ' + p.article : '') + '). Could you share price, sizes available and lead time?';
    document.getElementById('lightboxEnquire').href = 'https://wa.me/919967111111?text=' + encodeURIComponent(msg);
  }
  function closeLightbox(){
    lightbox.classList.remove('active');
    lightbox.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }
  function prevImage(){ const list = visibleProducts(); currentIndex = (currentIndex - 1 + list.length) % list.length; updateLightbox(list); }
  function nextImage(){ const list = visibleProducts(); currentIndex = (currentIndex + 1) % list.length; updateLightbox(list); }

  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  document.getElementById('lightboxPrev').addEventListener('click', prevImage);
  document.getElementById('lightboxNext').addEventListener('click', nextImage);
  lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', e => {
    if (!lightbox.classList.contains('active')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') prevImage();
    if (e.key === 'ArrowRight') nextImage();
  });

  const backToTop = document.getElementById('backToTop');
  window.addEventListener('scroll', () => backToTop.classList.toggle('visible', window.scrollY > 350), { passive:true });
  backToTop.addEventListener('click', () => window.scrollTo({ top:0, behavior:'smooth' }));

  buildFilters();
  renderGrid();
</script>
