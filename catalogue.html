<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Youniverse — original clothing available at major retail stores across Pan India.">
  <title>Catalogue — Youniverse</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root{--bg:#fbf8f2;--ink:#171310;--line:#ded3c4;--cream:#f4ecdf;--accent:#a84a2c}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}a{color:inherit;text-decoration:none}button{font:inherit}
    .wrap{width:min(1500px,94%);margin:0 auto}.site-header{position:sticky;top:0;z-index:20;background:rgba(251,248,242,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.site-header .wrap{min-height:68px;display:flex;align-items:center;justify-content:center}.brand{font:800 18px Georgia,"Times New Roman",serif;letter-spacing:.28em;text-transform:uppercase;padding:14px 5px}.brand:hover{color:var(--accent)}
    .intro{text-align:center;padding:30px 0 24px}.eyebrow{margin:0;color:var(--accent);font:700 11px "Courier New",monospace;letter-spacing:.14em;text-transform:uppercase}.intro h1{margin:8px 0 0;font:800 clamp(2rem,4vw,3.4rem) Georgia,"Times New Roman",serif;letter-spacing:-.04em}.intro-copy{max-width:600px;margin:12px auto 0;color:#403a34;font-size:15px;font-weight:600}
    .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:start;padding-bottom:72px}.card{display:block;width:100%;margin:0;padding:0;border:0;background:var(--cream);overflow:hidden;cursor:pointer;line-height:0}.card img{display:block;width:100%;height:auto;aspect-ratio:auto;object-fit:contain;transition:transform .25s ease}.card:hover img{transform:scale(1.02)}
    .top{position:fixed;right:18px;bottom:18px;z-index:40;width:44px;height:44px;border:1px solid var(--ink);border-radius:50%;background:var(--ink);color:#fff;cursor:pointer;font-size:22px;opacity:0;visibility:hidden;transform:translateY(8px);transition:.2s}.top.visible{opacity:1;visibility:visible;transform:none}.top:hover{background:var(--cream);color:var(--ink)}
    .lightbox{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(20,15,10,.94)}.lightbox.active{display:flex}.lightbox-inner{position:relative;display:flex;max-width:min(1100px,100%);max-height:100%;flex-direction:column;align-items:center}.lightbox img{max-width:100%;max-height:82vh;object-fit:contain}.close,.nav{position:absolute;display:grid;place-items:center;width:42px;height:42px;border:1px solid rgba(255,255,255,.7);border-radius:50%;background:rgba(0,0,0,.25);color:#fff;cursor:pointer;font-size:26px}.close{top:-8px;right:-8px}.nav{top:45%;transform:translateY(-50%)}.prev{left:-58px}.next{right:-58px}.enquire{margin-top:14px;padding:11px 16px;border:1px solid #fff;background:#fff;color:var(--ink);font:700 11px "Courier New",monospace;letter-spacing:.06em;text-transform:uppercase}
    footer{border-top:1px solid var(--line);padding:28px 0 38px;text-align:center}footer a{font:700 16px Georgia,"Times New Roman",serif;letter-spacing:.12em;text-transform:uppercase}
    @media(max-width:1100px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.prev{left:8px}.next{right:8px}}@media(max-width:700px){.wrap{width:100%;padding:0 10px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.brand{font-size:15px}.intro{padding:24px 0 18px}.top{right:12px;bottom:12px}}@media(max-width:460px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}}
  </style>
</head>
<body>
  <header class="site-header"><div class="wrap"><a class="brand" href="index.html" aria-label="Return to homepage">Youniverse</a></div></header>
  <main class="wrap" id="top">
    <section class="intro"><p class="eyebrow">Full Range</p><h1>The Catalogue</h1><p class="intro-copy">All our products are available at major retail stores across Pan India.</p></section>
    <section class="grid" id="grid" aria-label="Youniverse catalogue"></section>
  </main>
  <button class="top" id="topButton" type="button" aria-label="Back to top">↑</button>
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-hidden="true"><div class="lightbox-inner"><button class="close" id="close" type="button" aria-label="Close">×</button><button class="nav prev" id="prev" type="button" aria-label="Previous">‹</button><img id="largeImage" alt="Youniverse catalogue image"><button class="nav next" id="next" type="button" aria-label="Next">›</button><a class="enquire" id="enquire" target="_blank" rel="noopener">Enquire on WhatsApp</a></div></div>
  <footer><div class="wrap"><a href="index.html">Youniverse</a></div></footer>

    imageFiles.forEach((src,index)=>{const card=document.createElement("button");card.className="card";card.type="button";card.setAttribute("aria-label","Open catalogue image "+(index+1));const img=document.createElement("img");img.src=src;img.alt="Youniverse catalogue image";img.loading="lazy";card.appendChild(img);card.onclick=()=>open(index);grid.appendChild(card)});
