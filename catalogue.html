<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Catalogue — Youniverse</title>
  <meta name="description" content="Full catalogue of hand-painted shirts, patchwork denim and co-ords from Youniverse, made in Dadar, Mumbai." />
  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #666666;
      --line: #e5e5e5;
      --accent: #000000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* Header */
    .site-header {
      border-bottom: 1px solid var(--line);
      padding: 16px 0;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
    }
    .site-header .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .nav-links {
      display: flex;
      gap: 20px;
      font-size: 14px;
    }
    .nav-links a {
      color: var(--muted);
    }
    .nav-links a:hover {
      color: var(--text);
    }

    /* Page header */
    .page-header {
      padding: 40px 0 24px;
    }
    .page-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .page-subtitle {
      color: var(--muted);
      font-size: 15px;
      max-width: 700px;
    }

    /* Filters */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 20px 0 28px;
    }
    .filter-btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .filter-btn:hover {
      background: #f7f7f7;
    }
    .filter-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* Catalogue grid */
    .catalogue-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 16px;
      margin-bottom: 60px;
    }

    .product-card {
      grid-column: span 4;
      position: relative;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
    }
    .product-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }

    .product-card.feature {
      grid-column: span 6;
    }
    .product-card.tall {
      grid-column: span 3;
    }

    @media (max-width: 900px) {
      .product-card,
      .product-card.feature,
      .product-card.tall {
        grid-column: span 6;
      }
    }
    @media (max-width: 600px) {
      .catalogue-grid {
        grid-template-columns: 1fr;
      }
      .product-card,
      .product-card.feature,
      .product-card.tall {
        grid-column: span 1;
      }
    }

    .product-image-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      background: #f5f5f5;
      overflow: hidden;
    }
    .product-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      transition: transform 0.25s ease;
    }
    .product-card:hover .product-image-wrap img {
      transform: scale(1.03);
    }

    .product-info {
      padding: 12px 14px 14px;
      border-top: 1px solid var(--line);
      background: #fff;
    }
    .product-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .product-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .product-category {
      text-transform: capitalize;
    }
    .product-code {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      color: #888;
    }
    .new-badge {
      display: inline-block;
      background: #000;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .lightbox.active {
      display: flex;
    }
    .lightbox-content {
      position: relative;
      max-width: 100%;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .lightbox-image-wrap {
      position: relative;
      max-width: 100%;
      max-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lightbox-image-wrap img {
      max-width: 100%;
      max-height: 80vh;
      object-fit: contain;
      object-position: center;
      border-radius: 6px;
      background: #000;
    }
    .lightbox-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(255,255,255,0.15);
      border: none;
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.15);
      border: none;
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lightbox-nav.prev { left: 16px; }
    .lightbox-nav.next { right: 16px; }

    .lightbox-meta {
      color: #fff;
      text-align: center;
      max-width: 500px;
    }
    .lightbox-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .lightbox-sub {
      font-size: 13px;
      color: #ccc;
    }
    .lightbox-actions {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.1);
      color: #fff;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:hover {
      background: rgba(255,255,255,0.2);
    }
    .btn-primary {
      background: #fff;
      color: #000;
      border-color: #fff;
    }
    .btn-primary:hover {
      background: #f0f0f0;
    }

    /* Footer */
    .site-footer {
      border-top: 1px solid var(--line);
      padding: 40px 0 60px;
      margin-top: 40px;
    }
    .footer-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      gap: 32px;
    }
    @media (max-width: 700px) {
      .footer-grid {
        grid-template-columns: 1fr;
        gap: 24px;
      }
    }
    .footer-brand {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .footer-text {
      font-size: 14px;
      color: var(--muted);
      max-width: 420px;
    }
    .footer-heading {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .footer-links {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
      color: var(--muted);
    }
    .footer-links a:hover {
      color: var(--text);
    }
  </style>
</head>
