<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Youniverse catalogue — hand-painted and original clothing, made in Dadar, Mumbai.">
  <title>Catalogue — Youniverse</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root { --bg:#fbf8f2; --ink:#171310; --line:#ded3c4; --cream:#f4ecdf; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:Arial,Helvetica,sans-serif; }
    a { color:inherit; text-decoration:none; }
    button { font:inherit; }
    img { display:block; max-width:100%; }
    .container { width:min(1320px,94%); margin:0 auto; }
    .site-header { position:sticky; top:0; z-index:20; background:rgba(251,248,242,.95); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
    .site-header .container { min-height:72px; display:flex; align-items:center; justify-content:center; }
    .catalogue-brand { font-family:Georgia,"Times New Roman",serif; font-size:18px; font-weight:800; letter-spacing:.28em; text-transform:uppercase; padding:16px 6px; }
    .catalogue-brand:hover { opacity:.65; }
    .page-header { padding:42px 0 30px; text-align:center; }
    .page-header p { margin:0; font-family:"Courier New",monospace; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
    .catalogue-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; padding-bottom:72px; }
    .product-card { margin:0; background:var(--cream); border:1px solid var(--line); cursor:pointer; overflow:hidden; }
    .product-card:nth-child(7n+1), .product-card:nth-child(11n+4) { grid-column:span 2; }
    .product-card img { width:100%; height:100%; aspect-ratio:4/5; object-fit:contain; transition:transform .28s ease; }
    .product-card:hover img { transform:scale(1.025); }
    .back-to-top { position:fixed; right:20px; bottom:20px; z-index:40; width:46px; height:46px; border:1px solid var(--ink); border-radius:50%; background:var(--ink); color:#fff; cursor:pointer; font-size:23px; line-height:1; opacity:0; visibility:hidden; transform:translateY(12px); transition:opacity .2s ease,transform .2s ease,visibility .2s ease,background .2s ease,color .2s ease; }
    .back-to-top.visible { opacity:1; visibility:visible; transform:translateY(0); }
    .back-to-top:hover { background:var(--cream); color:var(--ink); }
    .lightbox { position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center; padding:20px; background:rgba(22,17,12,.94); }
    .lightbox.active { display:flex; }
    .lightbox-content { position:relative; max-width:min(1050px,100%); max-height:100%; display:flex; flex-direction:column; align-items:center; }
    .lightbox-image-wrap { display:flex; align-items:center; justify-content:center; max-height:78vh; }
    .lightbox-image-wrap img { max-width:100%; max-height:78vh; object-fit:contain; background:#171310; }
    .lightbox-close,.lightbox-nav { position:absolute; display:grid; place-items:center; width:43px; height:43px; border:1px solid rgba(255,255,255,.6); border-radius:50%; background:rgba(0,0,0,.28); color:#fff; cursor:pointer; font-size:27px; }
    .lightbox-close { top:-8px; right:-8px; }
    .lightbox-nav { top:45%; transform:translateY(-50%); }
    .lightbox-nav.prev { left:-62px; }
    .lightbox-nav.next { right:-62px; }
    .lightbox-actions { padding-top:16px; }
    .enquire-btn { display:inline-block; border:1px solid #fff; background:#fff; color:#171310; font-family:"Courier New",monospace; font-size:11px; font-weight:700; letter-spacing:.06em; padding:11px 16px; text-transform:uppercase; }
    .site-footer { border-top:1px solid var(--line); padding:32px 0 42px; text-align:center; }
    .site-footer a { font-family:Georgia,"Times New Roman",serif; font-size:16px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
    @media (max-width:900px) { .catalogue-grid { grid-template-columns:repeat(3,minmax(0,1fr)); } .lightbox-nav.prev { left:8px; } .lightbox-nav.next { right:8px; } }
    @media (max-width:600px) { .site-header .container { min-height:62px; } .catalogue-brand { font-size:15px; } .page-header { padding:30px 0 20px; } .catalogue-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; } .product-card:nth-child(7n+1),.product-card:nth-child(11n+4) { grid-column:span 1; } .back-to-top { right:14px; bottom:14px; } .lightbox { padding:10px; } .lightbox-close { top:7px; right:7px; } }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container"><a class="catalogue-brand" href="index.html" aria-label="Return to Youniverse homepage">Youniverse</a></div>
  </header>

  <main class="container" id="top">
    <section class="page-header"><p>Catalogue</p></section>
    <section class="catalogue-grid" id="catalogueGrid" aria-label="Youniverse catalogue"></section>
  </main>

  <button class="back-to-top" id="backToTop" type="button" aria-label="Back to top" title="Back to top">↑</button>

  <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Product image preview">
    <div class="lightbox-content">
      <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Close">×</button>
      <button class="lightbox-nav prev" id="lightboxPrev" type="button" aria-label="Previous image">‹</button>
      <div class="lightbox-image-wrap"><img id="lightboxImage" src="" alt="Youniverse catalogue image"></div>
      <button class="lightbox-nav next" id="lightboxNext" type="button" aria-label="Next image">›</button>
      <div class="lightbox-actions"><a class="enquire-btn" id="lightboxEnquire" href="#" target="_blank" rel="noopener">Enquire on WhatsApp</a></div>
    </div>
  </div>

  <footer class="site-footer"><div class="container"><a href="index.html">Youniverse</a></div></footer>

    const grid = document.getElementById("catalogueGrid");
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");
    const backToTop = document.getElementById("backToTop");
    let currentIndex = 0;

    productImages.forEach((src, index) => {
      const card = document.createElement("button");
      card.className = "product-card";
      card.type = "button";
      card.setAttribute("aria-label", "View catalogue image " + (index + 1));
      const image = document.createElement("img");
      image.src = src;
      image.alt = "Youniverse catalogue image";
      image.loading = "lazy";
      card.appendChild(image);
      card.addEventListener("click", () => openLightbox(index));
      grid.appendChild(card);
    });

    function updateLightbox() {
      lightboxImage.src = productImages[currentIndex];
      const message = "Hi Youniverse, I am interested in catalogue image " + (currentIndex + 1) + ". Please share the price, sizes available and lead time.";
      document.getElementById("lightboxEnquire").href = "https://wa.me/919967111111?text=" + encodeURIComponent(message);
    }
    function openLightbox(index) { currentIndex = index; updateLightbox(); lightbox.classList.add("active"); lightbox.setAttribute("aria-hidden", "false"); document.body.style.overflow = "hidden"; }
    function closeLightbox() { lightbox.classList.remove("active"); lightbox.setAttribute("aria-hidden", "true"); document.body.style.overflow = ""; }
    function previousImage() { currentIndex = (currentIndex - 1 + productImages.length) % productImages.length; updateLightbox(); }
    function nextImage() { currentIndex = (currentIndex + 1) % productImages.length; updateLightbox(); }

    document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
    document.getElementById("lightboxPrev").addEventListener("click", previousImage);
    document.getElementById("lightboxNext").addEventListener("click", nextImage);
    lightbox.addEventListener("click", event => { if (event.target === lightbox) closeLightbox(); });
    document.addEventListener("keydown", event => {
      if (!lightbox.classList.contains("active")) return;
      if (event.key === "Escape") closeLightbox();
      if (event.key === "ArrowLeft") previousImage();
      if (event.key === "ArrowRight") nextImage();
    });
    window.addEventListener("scroll", () => backToTop.classList.toggle("visible", window.scrollY > 350));
    backToTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
