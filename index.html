<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Youniverse — Women's Wear | Dadar Mumbai</title>
  <link rel="icon" type="image/jpeg" href="favicon.jpg" />
  <link rel="apple-touch-icon" href="favicon.jpg" />
  <meta name="description" content="Youniverse — women's western wear designed in Mumbai. Shirts and jeans made for original expression." />
  <meta name="theme-color" content="#070707" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Outfit:wght@300;400;500;600&family=Syne:wght@500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #070707;
      --bg-soft: #10100e;
      --bg-card: #171512;
      --ivory: #f4ebe1;
      --gold: #c9a66b;
      --gold-light: #e8c9a0;
      --muted: #9a9084;
      --line: rgba(201, 166, 107, 0.22);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--ivory);
      font-family: "Outfit", sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .container {
      width: min(1180px, 92%);
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    .noise {
      position: fixed;
      inset: 0;
      z-index: 80;
      pointer-events: none;
      opacity: 0.04;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      background: rgba(7, 7, 7, 0.78);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
    }

    nav {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4vw;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      font-family: "Syne", sans-serif;
      font-size: 13px;
      letter-spacing: 0.38em;
    }

    .brand img {
      width: auto;
      height: 44px;
      filter: drop-shadow(0 0 14px rgba(201, 166, 107, 0.45));
    }

    .nav-links {
      display: flex;
      gap: 28px;
    }

    .nav-links a,
    .nav-cta {
      position: relative;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -7px;
      width: 0;
      height: 1px;
      background: var(--gold);
      transition: width 0.3s ease;
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .nav-cta {
      border: 1px solid var(--gold);
      color: var(--gold-light);
      padding: 10px 16px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .nav-cta:hover {
      background: var(--gold);
      color: #111;
    }

    .nav-toggle {
      display: none;
      background: none;
      border: 0;
      color: var(--ivory);
      font-size: 24px;
      cursor: pointer;
    }

    .hero {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 130px 0 84px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero-media {
      position: absolute;
      inset: 0;
    }

    .hero-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: contrast(1.04) brightness(0.72);
      transform: scale(1.06);
      animation: ken-burns 18s ease-in-out infinite alternate;
    }

    .hero-media::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(
          ellipse at center,
          rgba(7, 7, 7, 0.05) 12%,
          rgba(7, 7, 7, 0.38) 78%
        ),
        linear-gradient(
          180deg,
          rgba(7, 7, 7, 0.15),
          rgba(7, 7, 7, 0.62)
        );
    }

    @keyframes ken-burns {
      to {
        transform: scale(1.14) translateY(-2%);
      }
    }

    .hero-inner {
      position: relative;
      z-index: 2;
    }

    .hero-logo {
      width: min(145px, 28vw);
      height: auto;
      margin: 0 auto 26px;
      padding: 10px;
      background: rgba(244, 235, 225, 0.92);
      box-shadow: 0 0 35px rgba(201, 166, 107, 0.28);
    }

    .kicker {
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .hero h1 {
      font-family: "Bodoni Moda", serif;
      font-weight: 500;
      font-size: clamp(3.15rem, 10.3vw, 9rem);
      line-height: 0.9;
      letter-spacing: 0.015em;
      white-space: nowrap;
      background: linear-gradient(
        90deg,
        #fff,
        var(--gold-light),
        #d08cff,
        var(--gold)
      );
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 6s linear infinite;
    }

    @keyframes shimmer {
      to {
        background-position: 200% center;
      }
    }

    .hero-tag {
      font-family: "Bodoni Moda", serif;
      font-style: italic;
      font-size: clamp(1.15rem, 2.4vw, 1.8rem);
      margin: 22px 0 10px;
    }

    .hero-sub {
      color: var(--gold-light);
      font-size: 11px;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      margin-bottom: 34px;
    }

    .hero-btns {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      border: 1px solid var(--gold);
      padding: 15px 25px;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .btn:hover {
      background: var(--ivory);
      color: #111;
    }

    .btn-fill {
      background: var(--gold);
      color: #111;
    }

    .marquee {
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 16px 0;
      overflow: hidden;
      text-align: center;
      color: var(--gold-light);
      font-family: "Syne", sans-serif;
      font-size: 11px;
      letter-spacing: 0.23em;
      text-transform: uppercase;
    }

    section {
      padding: 105px 0;
      position: relative;
      z-index: 2;
    }

    h2 {
      font-family: "Bodoni Moda", serif;
      font-weight: 500;
      font-size: clamp(2.4rem, 6vw, 4.6rem);
      line-height: 1.05;
    }

    .about-grid,
    .visit-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }

    .about-copy p,
    .visit-info p {
      margin: 16px 0;
      color: var(--muted);
    }

    .about-copy strong,
    .visit-info strong {
      color: var(--ivory);
    }

    .about-image {
      overflow: hidden;
      border: 1px solid var(--line);
    }

    .about-image img {
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      transition: transform 0.7s ease;
    }

    .about-image:hover img {
      transform: scale(1.05);
    }

    .looks-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 36px;
    }

    .looks-head > p {
      max-width: 420px;
      color: var(--muted);
    }

    .rail {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(270px, 22vw);
      gap: 18px;
      overflow-x: auto;
      padding-bottom: 18px;
      scroll-snap-type: x mandatory;
      scrollbar-color: var(--gold) transparent;
    }

    .look {
      height: 460px;
      position: relative;
      overflow: hidden;
      background: var(--bg-card);
      scroll-snap-align: start;
    }

    .look img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.7s ease;
    }

    .look:hover img {
      transform: scale(1.07);
    }

    .look::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        transparent 45%,
        rgba(0, 0, 0, 0.78)
      );
    }

    .look figcaption {
      position: absolute;
      z-index: 2;
      left: 18px;
      right: 18px;
      bottom: 18px;
      font-family: "Bodoni Moda", serif;
      font-size: 1.65rem;
    }

    .campaign,
    .visit {
      background: var(--bg-soft);
    }

    .campaign-grid {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      align-items: stretch;
      gap: 28px;
    }

    .campaign-copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .campaign-copy p {
      color: var(--muted);
      margin: 18px 0 28px;
      max-width: 470px;
    }

    .campaign-image {
      min-height: 510px;
      overflow: hidden;
      border: 1px solid var(--line);
    }

    .campaign-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .why-grid,
    .quotes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 40px;
    }

    .why-card,
    .quote {
      background: var(--bg-card);
      border: 1px solid var(--line);
      padding: 28px;
    }

    .why-card h3 {
      font-family: "Bodoni Moda", serif;
      font-weight: 500;
      font-size: 1.7rem;
      margin: 12px 0;
    }

    .why-card p {
      color: var(--muted);
    }

    .quote {
      border-top-color: var(--gold);
    }

    .quote p {
      font-family: "Bodoni Moda", serif;
      font-size: 1.3rem;
      font-style: italic;
      line-height: 1
